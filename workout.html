<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Gym Split</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0d;
    --surface: #161618;
    --surface2: #1f1f22;
    --surface3: #2a2a2e;
    --accent: #e8ff47;
    --push: #ff6b35;
    --pull: #38bdf8;
    --legs: #a78bfa;
    --text: #ececea;
    --muted: #6b6b70;
    --border: #2a2a2e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; padding-bottom: 60px; }

  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 16px 18px 12px; position: sticky; top: 0; z-index: 200;
  }
  header h1 { font-family: 'Bebas Neue', cursive; font-size: 1.85rem; letter-spacing: 2px; color: var(--accent); line-height: 1; }
  header p { font-size: 0.65rem; color: var(--muted); letter-spacing: 1.2px; text-transform: uppercase; margin-top: 2px; }

  /* SEARCH */
  .search-wrap { padding: 12px 14px 6px; }
  .search-wrap input {
    width: 100%; background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 10px; color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem; padding: 10px 14px; outline: none; transition: border-color 0.2s;
  }
  .search-wrap input::placeholder { color: var(--muted); }
  .search-wrap input:focus { border-color: var(--accent); }

  /* FILTER ROWS */
  .filter-group { padding: 8px 14px 2px; }
  .filter-group-label { font-size: 0.58rem; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px; }
  .filter-row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
  .filter-row::-webkit-scrollbar { display: none; }

  .ftab {
    flex-shrink: 0; font-size: 0.65rem; font-weight: 600; letter-spacing: 0.8px;
    text-transform: uppercase; padding: 6px 12px; border-radius: 20px;
    border: 1.5px solid var(--border); background: transparent; color: var(--muted);
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .ftab:hover { color: var(--text); border-color: var(--surface3); }
  .ftab.on { border-color: var(--accent); color: var(--accent); background: rgba(232,255,71,0.07); }
  .ftab.on-push { border-color: var(--push); color: var(--push); background: rgba(255,107,53,0.07); }
  .ftab.on-pull { border-color: var(--pull); color: var(--pull); background: rgba(56,189,248,0.07); }
  .ftab.on-legs { border-color: var(--legs); color: var(--legs); background: rgba(167,139,250,0.07); }

  .divider { height: 1px; background: var(--border); margin: 8px 14px 0; }

  /* ACTIVE FILTER PILLS */
  .active-filters { display: flex; flex-wrap: wrap; gap: 5px; padding: 8px 14px 2px; min-height: 0; }
  .af-pill {
    font-size: 0.62rem; font-weight: 600; letter-spacing: 0.5px;
    padding: 4px 10px; border-radius: 20px; background: rgba(232,255,71,0.1);
    color: var(--accent); border: 1px solid rgba(232,255,71,0.25);
    display: flex; align-items: center; gap: 5px; cursor: pointer;
  }
  .af-pill .pill-x { opacity: 0.6; font-size: 0.75rem; }

  /* SECTION LABELS */
  .section-label {
    font-size: 0.62rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); padding: 16px 14px 7px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* CARDS */
  .cards { padding: 0 10px; display: flex; flex-direction: column; gap: 8px; }

  .ex-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; transition: border-color 0.2s;
  }
  .ex-card[data-type="push"] { border-left: 3px solid var(--push); }
  .ex-card[data-type="pull"] { border-left: 3px solid var(--pull); }
  .ex-card[data-type="legs"] { border-left: 3px solid var(--legs); }
  .ex-card.hidden { display: none; }
  .ex-card.done { opacity: 0.38; }
  .ex-card.done .ex-name { text-decoration: line-through; }

  .ex-main { display: flex; align-items: center; gap: 11px; padding: 11px 13px; cursor: pointer; }

  .ex-thumb {
    width: 48px; height: 48px; border-radius: 10px; background: var(--surface2);
    flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 1.4rem;
  }

  .ex-info { flex: 1; min-width: 0; }
  .ex-name { font-size: 0.9rem; font-weight: 600; color: var(--text); line-height: 1.25; }
  .ex-equip { font-size: 0.65rem; color: var(--muted); margin-top: 2px; }

  /* SUB-MUSCLE TAGS */
  .ex-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .ex-tag {
    font-size: 0.58rem; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;
    padding: 2px 7px; border-radius: 5px;
  }
  .tag-primary { background: rgba(232,255,71,0.12); color: var(--accent); }
  .tag-secondary { background: rgba(255,255,255,0.06); color: var(--muted); }

  .ex-chevron { color: var(--muted); font-size: 0.9rem; transition: transform 0.25s; flex-shrink: 0; }
  .ex-card.open .ex-chevron { transform: rotate(90deg); }

  /* DETAIL */
  .ex-detail { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; background: var(--surface2); }
  .ex-card.open .ex-detail { max-height: 700px; }
  .ex-detail-inner { padding: 13px 15px 15px; border-top: 1px solid var(--border); }

  .detail-gif {
    width: 100%; border-radius: 10px; background: var(--surface3);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 10px; overflow: hidden; min-height: 72px;
  }
  .detail-gif img { width: 100%; border-radius: 10px; display: block; }
  .gif-placeholder { padding: 16px; text-align: center; color: var(--muted); font-size: 0.73rem; }
  .gif-placeholder .big { font-size: 1.8rem; display: block; margin-bottom: 5px; }

  .gif-link {
    display: block; text-align: center; font-size: 0.7rem; color: var(--accent);
    text-decoration: none; margin-bottom: 11px; padding: 7px 12px;
    background: rgba(232,255,71,0.06); border-radius: 8px;
    border: 1px solid rgba(232,255,71,0.13); letter-spacing: 0.3px;
  }

  .detail-sets { display: flex; gap: 7px; margin-bottom: 11px; }
  .detail-pill { flex: 1; background: var(--surface3); border-radius: 8px; padding: 7px 6px; text-align: center; }
  .detail-pill .dpnum { font-family: 'Bebas Neue', cursive; font-size: 1.35rem; color: var(--accent); letter-spacing: 1px; line-height: 1; }
  .detail-pill .dplbl { font-size: 0.57rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }

  /* MUSCLE BREAKDOWN IN DETAIL */
  .muscle-breakdown { margin-bottom: 11px; }
  .mb-title { font-size: 0.6rem; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .mb-bars { display: flex; flex-direction: column; gap: 5px; }
  .mb-row { display: flex; align-items: center; gap: 8px; }
  .mb-label { font-size: 0.65rem; color: var(--text); width: 130px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mb-bar-bg { flex: 1; background: var(--surface3); border-radius: 3px; height: 5px; }
  .mb-bar-fill { height: 100%; border-radius: 3px; background: var(--accent); }
  .mb-pct { font-size: 0.6rem; color: var(--muted); width: 28px; text-align: right; }

  .detail-tip { font-size: 0.76rem; color: var(--muted); line-height: 1.6; }
  .detail-tip strong { color: var(--text); font-weight: 600; }

  .done-row { display: flex; align-items: center; justify-content: space-between; margin-top: 11px; padding-top: 11px; border-top: 1px solid var(--border); }
  .done-label { font-size: 0.7rem; color: var(--muted); }
  .done-toggle { width: 40px; height: 22px; border-radius: 11px; background: var(--surface3); border: none; cursor: pointer; position: relative; transition: background 0.2s; }
  .done-toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: all 0.2s; }
  .done-toggle.on { background: var(--accent); }
  .done-toggle.on::after { left: 21px; background: #0c0c0d; }

  .no-results { text-align: center; padding: 48px 20px; color: var(--muted); font-size: 0.85rem; display: none; }
  .no-results.show { display: block; }
  .no-results .big { font-size: 2.5rem; display: block; margin-bottom: 10px; }
</style>
</head>

// ─── FILTER CONFIG ────────────────────────────────────────────────────────────
const TYPE_FILTERS = [
  { key:'all', label:'All', cls:'on' },
  { key:'push', label:'🔴 Push', cls:'on-push' },
  { key:'pull', label:'🔵 Pull', cls:'on-pull' },
  { key:'legs', label:'🟣 Legs', cls:'on-legs' },
];

const MUSCLE_FILTERS = [
  'chest','shoulders','triceps','back','biceps','abs','quads','hamstrings','calves'
];

// Collect all unique sub-muscle tags from data
const allSubTags = [...new Set(EXERCISES.flatMap(e => e.tags))].sort();

// Selected filters state
let activeType = 'all';
let activeMuscles = new Set();
let activeSubTags = new Set();

// Build type tabs
const rowType = document.getElementById('row-type');
TYPE_FILTERS.forEach(f => {
  const btn = document.createElement('button');
  btn.className = 'ftab' + (f.key==='all' ? ' on' : '');
  btn.textContent = f.label;
  btn.dataset.key = f.key;
  btn.dataset.cls = f.cls;
  btn.onclick = () => {
    activeType = f.key;
    document.querySelectorAll('#row-type .ftab').forEach(b => b.className='ftab');
    btn.className = `ftab ${f.cls}`;
    applyFilters();
  };
  rowType.appendChild(btn);
});

// Build muscle tabs
const rowMuscle = document.getElementById('row-muscle');
MUSCLE_FILTERS.forEach(m => {
  const btn = document.createElement('button');
  btn.className = 'ftab';
  btn.textContent = m.charAt(0).toUpperCase()+m.slice(1);
  btn.dataset.muscle = m;
  btn.onclick = () => {
    if(activeMuscles.has(m)) { activeMuscles.delete(m); btn.className='ftab'; }
    else { activeMuscles.add(m); btn.className='ftab on'; }
    applyFilters();
  };
  rowMuscle.appendChild(btn);
});

// Build sub-tag tabs dynamically
const rowSub = document.getElementById('row-sub');
allSubTags.forEach(tag => {
  const btn = document.createElement('button');
  btn.className = 'ftab';
  btn.textContent = tag;
  btn.dataset.tag = tag;
  btn.onclick = () => {
    if(activeSubTags.has(tag)) { activeSubTags.delete(tag); btn.className='ftab'; }
    else { activeSubTags.add(tag); btn.className='ftab on'; }
    applyFilters();
  };
  rowSub.appendChild(btn);
});

// ─── BUILD EXERCISE LIST ──────────────────────────────────────────────────────
const MUSCLE_ORDER = ['chest','shoulders','triceps','back','biceps','abs','quads','hamstrings','calves'];
const MUSCLE_LABELS = { chest:'Chest', shoulders:'Shoulders', triceps:'Triceps', back:'Back', biceps:'Biceps', abs:'Abs', quads:'Quads', hamstrings:'Hamstrings', calves:'Calves' };

const container = document.getElementById('exerciseList');

MUSCLE_ORDER.forEach(muscle => {
  const exes = EXERCISES.filter(e => e.muscle === muscle);
  if(!exes.length) return;

  const sec = document.createElement('div');
  sec.className = 'section-label'; sec.dataset.muscle = muscle;
  sec.textContent = MUSCLE_LABELS[muscle];
  container.appendChild(sec);

  const cardsDiv = document.createElement('div');
  cardsDiv.className = 'cards'; cardsDiv.dataset.muscle = muscle;

  exes.forEach((ex, idx) => {
    const uid = `${muscle}-${idx}`;
    const card = document.createElement('div');
    card.className = 'ex-card';
    card.dataset.type = ex.type;
    card.dataset.muscle = ex.muscle;
    card.dataset.name = ex.name.toLowerCase();
    card.dataset.tags = ex.tags.join('|');
    card.id = 'card-' + uid;
    card._gifUrl = ex.gifUrl;

    // Primary tag (first), secondary (rest)
    const tagHTML = ex.submuscles.map((s,i) =>
      `<span class="ex-tag ${i===0?'tag-primary':'tag-secondary'}">${s.n.split('(')[0].trim()}</span>`
    ).join('');

    // Muscle breakdown bars
    const barsHTML = ex.submuscles.map(s => `
      <div class="mb-row">
        <div class="mb-label">${s.n}</div>
        <div class="mb-bar-bg"><div class="mb-bar-fill" style="width:${s.p}%"></div></div>
        <div class="mb-pct">${s.p}%</div>
      </div>`).join('');

    card.innerHTML = `
      <div class="ex-main" onclick="toggleCard('${uid}')">
        <div class="ex-thumb">${ex.emoji}</div>
        <div class="ex-info">
          <div class="ex-name">${ex.name}</div>
          <div class="ex-equip">📍 ${ex.equip}</div>
          <div class="ex-tags">${tagHTML}</div>
        </div>
        <div class="ex-chevron">›</div>
      </div>
      <div class="ex-detail" id="detail-${uid}">
        <div class="ex-detail-inner">
          <div class="detail-gif" id="gif-${uid}">
            <div class="gif-placeholder"><span class="big">🎬</span>Loading demo…</div>
          </div>
          <a class="gif-link" href="${ex.vidUrl}" target="_blank" rel="noopener">▶ Watch form tutorial on YouTube ↗</a>
          <div class="detail-sets">
            <div class="detail-pill"><div class="dpnum">2–3</div><div class="dplbl">Sets</div></div>
            <div class="detail-pill"><div class="dpnum" style="font-size:0.95rem;padding-top:5px">RTF</div><div class="dplbl">Reps</div></div>
          </div>
          <div class="muscle-breakdown">
            <div class="mb-title">Muscles Targeted</div>
            <div class="mb-bars">${barsHTML}</div>
          </div>
          <div class="detail-tip">${ex.tip}</div>
          <div class="done-row">
            <span class="done-label">Mark as done</span>
            <button class="done-toggle" id="tog-${uid}" onclick="toggleDone('${uid}')"></button>
          </div>
        </div>
      </div>`;

    cardsDiv.appendChild(card);
  });
  container.appendChild(cardsDiv);
});

function renderPills() {
  const box = document.getElementById('activePills');
  box.innerHTML = '';
  activeMuscles.forEach(m => {
    const p = document.createElement('div'); p.className = 'af-pill';
    p.innerHTML = `${m.charAt(0).toUpperCase()+m.slice(1)} <span class="pill-x">✕</span>`;
    p.onclick = () => {
      activeMuscles.delete(m);
      const btn = document.querySelector(`[data-muscle="${m}"]`);
      if(btn) btn.className = 'ftab';
      applyFilters();
    };
    box.appendChild(p);
  });
  activeSubTags.forEach(tag => {
    const p = document.createElement('div'); p.className = 'af-pill';
    p.innerHTML = `${tag} <span class="pill-x">✕</span>`;
    p.onclick = () => {
      activeSubTags.delete(tag);
      const btn = document.querySelector(`[data-tag="${tag}"]`);
      if(btn) btn.className = 'ftab';
      applyFilters();
    };
    box.appendChild(p);
  });
}

// ─── APPLY FILTERS ───────────────────────────────────────────────────────────
function applyFilters() {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  let anyVisible = false;

  document.querySelectorAll('.ex-card').forEach(card => {
    const typeOk = activeType === 'all' || card.dataset.type === activeType;
    const muscleOk = activeMuscles.size === 0 || activeMuscles.has(card.dataset.muscle);
    const cardTags = card.dataset.tags.split('|');
    const tagOk = activeSubTags.size === 0 || [...activeSubTags].every(t => cardTags.includes(t));
    const searchOk = !search || card.dataset.name.includes(search) || card.dataset.tags.includes(search);
    const show = typeOk && muscleOk && tagOk && searchOk;
    card.classList.toggle('hidden', !show);
    if(show) anyVisible = true;
  });

  document.querySelectorAll('.section-label').forEach(sec => {
    const m = sec.dataset.muscle;
    const cards = document.querySelector(`.cards[data-muscle="${m}"]`);
    const hasVis = cards && [...cards.querySelectorAll('.ex-card')].some(c => !c.classList.contains('hidden'));
    sec.style.display = hasVis ? '' : 'none';
    if(cards) cards.style.display = hasVis ? '' : 'none';
  });

  document.getElementById('noResults').classList.toggle('show', !anyVisible);
  renderPills();
}

// ─── CARD TOGGLE ─────────────────────────────────────────────────────────────
function toggleCard(uid) {
  const card = document.getElementById('card-' + uid);
  const isOpen = card.classList.contains('open');
  document.querySelectorAll('.ex-card.open').forEach(c => c.classList.remove('open'));
  if(!isOpen) {
    card.classList.add('open');
    const gifBox = document.getElementById('gif-' + uid);
    if(!gifBox.querySelector('img') && card._gifUrl) {
      const img = document.createElement('img');
      img.src = card._gifUrl;
      img.alt = "Exercise demo";
      img.onerror = () => { gifBox.innerHTML = '<div class="gif-placeholder"><span class="big">📺</span>Demo unavailable — use YouTube link below</div>'; };
      gifBox.innerHTML = '';
      gifBox.appendChild(img);
    }
    setTimeout(() => card.scrollIntoView({ behavior:'smooth', block:'nearest' }), 60);
  }
}

function toggleDone(uid) {
  const card = document.getElementById('card-' + uid);
  const tog = document.getElementById('tog-' + uid);
  card.classList.toggle('done');
  tog.classList.toggle('on');
}
</script>
