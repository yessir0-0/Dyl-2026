<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Gym Split</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0d;
    --surface: #161618;
    --surface2: #1f1f22;
    --surface3: #2a2a2e;
    --accent: #e8ff47;
    --push: #ff6b35;
    --pull: #38bdf8;
    --legs: #a78bfa;
    --text: #ececea;
    --muted: #6b6b70;
    --border: #2a2a2e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  /* HEADER */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 18px 12px;
    position: sticky; top: 0; z-index: 200;
  }
  .header-row { display: flex; align-items: center; justify-content: space-between; }
  header h1 {
    font-family: 'Bebas Neue', cursive;
    font-size: 1.85rem; letter-spacing: 2px; color: var(--accent); line-height: 1;
  }
  header p { font-size: 0.65rem; color: var(--muted); letter-spacing: 1.2px; text-transform: uppercase; margin-top: 2px; }

  /* FILTER TABS */
  .filter-row {
    display: flex; gap: 7px; padding: 14px 16px 0; overflow-x: auto; scrollbar-width: none;
  }
  .filter-row::-webkit-scrollbar { display: none; }
  .ftab {
    flex-shrink: 0;
    font-size: 0.68rem; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase;
    padding: 7px 14px; border-radius: 20px;
    border: 1.5px solid var(--border);
    background: transparent; color: var(--muted);
    cursor: pointer; transition: all 0.18s;
  }
  .ftab.active-all  { border-color: var(--accent); color: var(--accent); background: rgba(232,255,71,0.08); }
  .ftab.active-push { border-color: var(--push); color: var(--push); background: rgba(255,107,53,0.08); }
  .ftab.active-pull { border-color: var(--pull); color: var(--pull); background: rgba(56,189,248,0.08); }
  .ftab.active-legs { border-color: var(--legs); color: var(--legs); background: rgba(167,139,250,0.08); }

  /* SEARCH */
  .search-wrap { padding: 12px 16px 4px; }
  .search-wrap input {
    width: 100%;
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 10px; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 0.85rem;
    padding: 10px 14px; outline: none;
    transition: border-color 0.2s;
  }
  .search-wrap input::placeholder { color: var(--muted); }
  .search-wrap input:focus { border-color: var(--accent); }

  /* MUSCLE GROUP SECTIONS */
  .section-label {
    font-size: 0.62rem; font-weight: 600; letter-spacing: 2px;
    text-transform: uppercase; color: var(--muted);
    padding: 18px 16px 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* EXERCISE CARDS */
  .cards { padding: 0 12px; display: flex; flex-direction: column; gap: 9px; }

  .ex-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .ex-card[data-type="push"] { border-left: 3px solid var(--push); }
  .ex-card[data-type="pull"] { border-left: 3px solid var(--pull); }
  .ex-card[data-type="legs"] { border-left: 3px solid var(--legs); }

  .ex-card.hidden { display: none; }

  .ex-main {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    cursor: pointer;
  }

  .ex-thumb {
    width: 52px; height: 52px; border-radius: 10px;
    background: var(--surface2);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem;
    overflow: hidden;
    position: relative;
  }

  .ex-info { flex: 1; min-width: 0; }
  .ex-name {
    font-size: 0.93rem; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    line-height: 1.25;
  }
  .ex-meta { font-size: 0.67rem; color: var(--muted); margin-top: 3px; line-height: 1.4; }
  .ex-meta span { margin-right: 8px; }

  .ex-chevron {
    color: var(--muted); font-size: 0.85rem; transition: transform 0.25s; flex-shrink: 0;
  }
  .ex-card.open .ex-chevron { transform: rotate(90deg); }

  /* EXPANDED DETAIL */
  .ex-detail {
    max-height: 0; overflow: hidden;
    transition: max-height 0.35s ease;
    background: var(--surface2);
  }
  .ex-card.open .ex-detail { max-height: 600px; }

  .ex-detail-inner { padding: 14px 16px 16px; border-top: 1px solid var(--border); }

  .detail-gif {
    width: 100%; border-radius: 10px;
    background: var(--surface3);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 12px;
    overflow: hidden;
    min-height: 80px;
  }
  .detail-gif img { width: 100%; border-radius: 10px; display: block; }
  .detail-gif .gif-placeholder {
    padding: 18px;
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
  }
  .detail-gif .gif-placeholder .big { font-size: 2rem; display: block; margin-bottom: 6px; }

  .gif-link {
    display: block;
    text-align: center;
    font-size: 0.72rem;
    color: var(--accent);
    text-decoration: none;
    margin-bottom: 12px;
    padding: 8px 12px;
    background: rgba(232,255,71,0.07);
    border-radius: 8px;
    border: 1px solid rgba(232,255,71,0.15);
    letter-spacing: 0.5px;
  }
  .gif-link:hover { background: rgba(232,255,71,0.12); }

  .detail-sets {
    display: flex; gap: 8px; margin-bottom: 12px;
  }
  .detail-pill {
    flex: 1; background: var(--surface3); border-radius: 8px;
    padding: 8px 6px; text-align: center;
  }
  .detail-pill .dpnum {
    font-family: 'Bebas Neue', cursive; font-size: 1.4rem;
    color: var(--accent); letter-spacing: 1px; line-height: 1;
  }
  .detail-pill .dplbl {
    font-size: 0.58rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.8px;
  }

  .detail-tip {
    font-size: 0.78rem; color: var(--muted); line-height: 1.6;
  }
  .detail-tip strong { color: var(--text); font-weight: 600; }

  /* DONE TOGGLE */
  .done-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);
  }
  .done-label { font-size: 0.72rem; color: var(--muted); }
  .done-toggle {
    width: 40px; height: 22px; border-radius: 11px;
    background: var(--surface3); border: none; cursor: pointer;
    position: relative; transition: background 0.2s;
  }
  .done-toggle::after {
    content: '';
    position: absolute; top: 3px; left: 3px;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--muted); transition: all 0.2s;
  }
  .done-toggle.on { background: var(--accent); }
  .done-toggle.on::after { left: 21px; background: #0c0c0d; }

  .ex-card.done { opacity: 0.4; }
  .ex-card.done .ex-name { text-decoration: line-through; }

  /* NO RESULTS */
  .no-results {
    text-align: center; padding: 48px 20px;
    color: var(--muted); font-size: 0.85rem; display: none;
  }
  .no-results.show { display: block; }
  .no-results .big { font-size: 2.5rem; display: block; margin-bottom: 10px; }
</style>
</head>

// ─── GROUP BY MUSCLE ─────────────────────────────────────────────────────────
const MUSCLE_ORDER = ['chest','shoulders','triceps','back','biceps','abs','quads','hamstrings','calves'];
const MUSCLE_LABELS = {
  chest:'Chest', shoulders:'Shoulders', triceps:'Triceps',
  back:'Back', biceps:'Biceps', abs:'Abs',
  quads:'Quads', hamstrings:'Hamstrings', calves:'Calves'
};

const container = document.getElementById('exerciseList');

MUSCLE_ORDER.forEach(muscle => {
  const exes = EXERCISES.filter(e => e.muscle === muscle);
  if (!exes.length) return;

  const sec = document.createElement('div');
  sec.className = 'section-label';
  sec.dataset.muscle = muscle;
  sec.textContent = MUSCLE_LABELS[muscle];
  container.appendChild(sec);

  const cardsDiv = document.createElement('div');
  cardsDiv.className = 'cards';
  cardsDiv.dataset.muscle = muscle;

  exes.forEach((ex, idx) => {
    const uid = `${muscle}-${idx}`;
    const card = document.createElement('div');
    card.className = 'ex-card';
    card.dataset.type = ex.type;
    card.dataset.muscle = ex.muscle;
    card.dataset.name = ex.name.toLowerCase();
    card.id = 'card-' + uid;

    card.innerHTML = `
      <div class="ex-main" onclick="toggleCard('${uid}')">
        <div class="ex-thumb">${ex.emoji}</div>
        <div class="ex-info">
          <div class="ex-name">${ex.name}</div>
          <div class="ex-meta">
            <span>📍 ${ex.equip}</span>
          </div>
        </div>
        <div class="ex-chevron">›</div>
      </div>
      <div class="ex-detail" id="detail-${uid}">
        <div class="ex-detail-inner">
          <div class="detail-gif" id="gif-${uid}">
            <div class="gif-placeholder"><span class="big">🎬</span>Tap to load demo</div>
          </div>
          <a class="gif-link" href="${ex.vidUrl}" target="_blank" rel="noopener">▶ Watch form tutorial on YouTube ↗</a>
          <div class="detail-sets">
            <div class="detail-pill"><div class="dpnum">${ex.sets}</div><div class="dplbl">Sets</div></div>
            <div class="detail-pill"><div class="dpnum" style="font-size:1rem;padding-top:4px">RTF</div><div class="dplbl">Reps</div></div>
          </div>
          <div class="detail-tip">${ex.tip}</div>
          <div class="done-row">
            <span class="done-label">Mark as done</span>
            <button class="done-toggle" id="tog-${uid}" onclick="toggleDone('${uid}')"></button>
          </div>
        </div>
      </div>`;

    // lazy load gif on open
    card._gifUrl = ex.gifUrl;
    card._uid = uid;
    cardsDiv.appendChild(card);
  });

  container.appendChild(cardsDiv);
});

// ─── TOGGLE CARD ─────────────────────────────────────────────────────────────
function toggleCard(uid) {
  const card = document.getElementById('card-' + uid);
  const isOpen = card.classList.contains('open');
  // close others
  document.querySelectorAll('.ex-card.open').forEach(c => c.classList.remove('open'));
  if (!isOpen) {
    card.classList.add('open');
    // lazy load gif
    const gifBox = document.getElementById('gif-' + uid);
    if (!gifBox.querySelector('img') && card._gifUrl) {
      const img = document.createElement('img');
      img.src = card._gifUrl;
      img.alt = "Exercise demo";
      img.onerror = () => {
        gifBox.innerHTML = '<div class="gif-placeholder"><span class="big">📺</span>Demo not available — use YouTube link below</div>';
      };
      gifBox.innerHTML = '';
      gifBox.appendChild(img);
    }
    // scroll into view
    setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
  }
}

// ─── DONE TOGGLE ─────────────────────────────────────────────────────────────
function toggleDone(uid) {
  const card = document.getElementById('card-' + uid);
  const tog = document.getElementById('tog-' + uid);
  card.classList.toggle('done');
  tog.classList.toggle('on');
}

// ─── FILTER ──────────────────────────────────────────────────────────────────
let activeFilter = 'all';

function filterBy(key, btn) {
  activeFilter = key;
  document.querySelectorAll('.ftab').forEach(t => {
    t.className = 'ftab';
  });
  if (btn) {
    const cls = ['push','pull','legs'].includes(key) ? `active-${key}` : 'active-all';
    btn.className = `ftab ${cls}`;
  }
  applyFilters();
}

function searchEx(val) {
  applyFilters(val.toLowerCase().trim());
}

function applyFilters(search = document.getElementById('searchInput').value.toLowerCase().trim()) {
  let anyVisible = false;

  document.querySelectorAll('.ex-card').forEach(card => {
    const typeMatch = activeFilter === 'all' || card.dataset.type === activeFilter || card.dataset.muscle === activeFilter;
    const searchMatch = !search || card.dataset.name.includes(search);
    const show = typeMatch && searchMatch;
    card.classList.toggle('hidden', !show);
    if (show) anyVisible = true;
  });

  // hide empty section headers
  document.querySelectorAll('.section-label').forEach(sec => {
    const muscle = sec.dataset.muscle;
    const cards = document.querySelector(`.cards[data-muscle="${muscle}"]`);
    const hasVisible = cards && [...cards.querySelectorAll('.ex-card')].some(c => !c.classList.contains('hidden'));
    sec.style.display = hasVisible ? '' : 'none';
    if (cards) cards.style.display = hasVisible ? '' : 'none';
  });

  document.getElementById('noResults').classList.toggle('show', !anyVisible);
}
